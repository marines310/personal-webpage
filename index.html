<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mike Lee — Interactive Portfolio</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-content">
      <h1>Loading Portfolio...</h1>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
    </div>
  </div>

  <!-- UI Overlay -->
  <div id="ui">
    <!-- Speedometer -->
    <div id="speedometer">
      <div class="speed-value">0</div>
      <div class="speed-label">MPH</div>
    </div>

    <!-- Time of day and weather. Click it to take control. -->
    <div id="conditions">
      <button id="cond-toggle" type="button" aria-expanded="false"
              aria-controls="cond-panel" title="Set the time and weather">
        <div class="cond-time">
          <span class="cond-icon" id="cond-sky-icon">&#9728;</span>
          <span id="cond-clock">06:00</span>
        </div>
        <div class="cond-weather" id="cond-weather">Clear</div>
        <div class="cond-manual" id="cond-manual">held</div>
      </button>

      <div id="cond-panel" class="hidden">
        <label class="cond-field" for="cond-hour">
          <span>Time</span>
          <output id="cond-hour-value">06:00</output>
        </label>
        <input id="cond-hour" type="range" min="0" max="1439" step="5" value="360">

        <div class="cond-row" id="cond-presets">
          <button type="button" data-hour="6">Dawn</button>
          <button type="button" data-hour="13">Noon</button>
          <button type="button" data-hour="19">Dusk</button>
          <button type="button" data-hour="1">Night</button>
        </div>

        <div class="cond-label">Weather</div>
        <div class="cond-row" id="cond-weathers">
          <button type="button" data-weather="clear">Clear</button>
          <button type="button" data-weather="breezy">Breezy</button>
          <button type="button" data-weather="cloudy">Cloudy</button>
          <button type="button" data-weather="showers">Showers</button>
          <button type="button" data-weather="storm">Storm</button>
        </div>

        <button type="button" id="cond-auto" class="cond-auto">
          Back to the automatic cycle
        </button>
      </div>
    </div>

    <!-- Controls hint -->
    <div id="controls-hint">
      <p>WASD or Arrow Keys to drive</p>
      <p>SHIFT to boost &middot; SPACE to brake</p>
      <p>C to re-centre the camera</p>
    </div>

    <!-- Zone content panels -->
    <div id="zone-panel" class="hidden">
      <div class="panel-content">
        <h2 id="zone-title"></h2>
        <div id="zone-body"></div>
      </div>
    </div>
  </div>

  <!-- Minimap -->
  <div id="minimap">
    <canvas id="minimap-canvas"></canvas>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
